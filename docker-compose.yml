services:
  # 前端服务
  ruoyi-frontend:
    build:
      context: ./ruoyi-fastapi-frontend
      dockerfile: Dockerfile
    image: cradle-frontend:latest
    container_name: cradle-frontend
    ports:
      - "12580:80"
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.docker.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - ruoyi-backend
    networks:
      - ruoyi-network

  # 后端服务
  ruoyi-backend:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile
    image: cradle-backend:latest
    container_name: cradle-backend
    ports:
      - "19099:9099"
    depends_on:
      ruoyi-db:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    networks:
      - ruoyi-network

  # PostgreSQL服务 (带pgvector扩展)
  ruoyi-db:
    image: pgvector/pgvector:pg17
    container_name: cradle-db
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ruoyi-fastapi
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "25432:5432"
    volumes:
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/1-ruoyi-fastapi-pg.sql
      - ./ruoyi-fastapi-backend/sql/rag_tables.sql:/docker-entrypoint-initdb.d/2-rag_tables.sql
      - ./ruoyi-fastapi-backend/sql/rag_menu.sql:/docker-entrypoint-initdb.d/3-rag_menu.sql
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  ruoyi-redis:
    image: redis:latest
    container_name: cradle-redis
    ports:
      - "16379:6379"
    networks:
      - ruoyi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  ruoyi-network:
    name: cradle-network
    driver: bridge
