services:
  # 前端服务
  cradle-frontend:
    build:
      context: ./ruoyi-fastapi-frontend
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${FRONTEND_NODE_BASE_IMAGE:-node:18-slim}
        NGINX_BASE_IMAGE: ${FRONTEND_NGINX_BASE_IMAGE:-nginx:latest}
    image: cradle-frontend:latest
    container_name: cradle-frontend
    ports:
      - "18080:80"
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.docker.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - cradle-backend
    networks:
      - cradle-network

  # 后端服务
  cradle-backend:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${BACKEND_PYTHON_BASE_IMAGE:-python:3.12}
    image: cradle-backend:latest
    container_name: cradle-backend
    env_file:
      - ./ruoyi-fastapi-backend/.env.docker
    ports:
      - "29099:29099"
    extra_hosts:
      - "host.docker.internal:192.168.0.1"
    volumes:
      - ./data/cradle-backend/upload_path:/app/vf_admin/upload_path
      - ./data/cradle-backend/download_path:/app/vf_admin/download_path
    depends_on:
      cradle-db:
        condition: service_healthy
      cradle-redis:
        condition: service_healthy
    networks:
      - cradle-network

  # MinIO对象存储服务
  cradle-minio:
    profiles:
      - minio
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: cradle-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ./data/cradle-minio:/data
    networks:
      - cradle-network

  # PostgreSQL服务 (带pgvector扩展)
  cradle-db:
    image: pgvector/pgvector:pg17
    container_name: cradle-db
    command: ["postgres", "-p", "54322"]
    environment:
      POSTGRES_PASSWORD: root
      POSTGRES_DB: cradle-fastapi
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C
    ports:
      - "54322:54322"
    volumes:
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/1-cradle-fastapi-pg.sql
      - ./ruoyi-fastapi-backend/sql/rag_tables.sql:/docker-entrypoint-initdb.d/2-rag_tables.sql
    networks:
      - cradle-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-p", "54322"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  cradle-redis:
    image: redis:latest
    container_name: cradle-redis
    ports:
      - "26379:6379"
    networks:
      - cradle-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

# 网络配置
networks:
  cradle-network:
    name: cradle-network
    driver: bridge
