# PostgreSQL 17 production profile for pgvector workloads.
# Target host:
# - RAM: 256 GB
# - Disk: 1 TB SSD/NVMe
# - Workload: around 100k documents after chunking/vectorization

listen_addresses = '*'
port = 54322
max_connections = 200
shared_buffers = 64GB
effective_cache_size = 192GB
maintenance_work_mem = 8GB
autovacuum_work_mem = 2GB
work_mem = 64MB
temp_buffers = 64MB
wal_buffers = 64MB
min_wal_size = 4GB
max_wal_size = 32GB
checkpoint_completion_target = 0.9
wal_compression = on
default_statistics_target = 500
random_page_cost = 1.1
effective_io_concurrency = 200
maintenance_io_concurrency = 200
max_worker_processes = 32
max_parallel_workers = 16
max_parallel_maintenance_workers = 4
max_parallel_workers_per_gather = 4
huge_pages = try
jit = off

# pgvector recall/speed balance for IVFFlat retrieval.
ivfflat.probes = 20

# Keep autovacuum aggressive enough for large append-heavy chunk tables.
autovacuum_naptime = 20s
autovacuum_vacuum_scale_factor = 0.02
autovacuum_analyze_scale_factor = 0.01
vacuum_cost_limit = 4000

log_timezone = 'Asia/Shanghai'
timezone = 'Asia/Shanghai'
