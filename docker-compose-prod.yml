# All host-side paths in this file are relative to the deployment root
# where `docker-compose-prod.yml` is located.
# Example deployment root:
#   /opt/cradle
# Then:
#   /opt/cradle/data/cradle-db -> PostgreSQL data
#   /opt/cradle/deploy/postgres/postgresql.prod.conf -> PostgreSQL config
#   /opt/cradle/ruoyi-fastapi-backend/.env.prod -> backend production env
# MinIO supports two modes:
# 1. external/shared MinIO configured via ruoyi-fastapi-backend/.env.prod
# 2. local MinIO started from this compose file with profile `local-minio`
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

services:
  cradle-frontend:
    image: cradle-frontend:prod
    container_name: cradle-frontend
    restart: unless-stopped
    ports:
      - "18080:80"
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      cradle-backend:
        condition: service_healthy
    networks:
      - cradle-network
    logging: *default-logging

  cradle-backend:
    image: cradle-backend:prod
    container_name: cradle-backend
    restart: unless-stopped
    command: ["python", "app.py", "--env=prod"]
    env_file:
      - ./ruoyi-fastapi-backend/.env.prod
    ports:
      - "127.0.0.1:29099:29099"
    volumes:
      - ./data/cradle-backend/upload_path:/app/vf_admin/upload_path
      - ./data/cradle-backend/download_path:/app/vf_admin/download_path
      - ./logs/cradle-backend:/app/logs
    depends_on:
      cradle-db:
        condition: service_healthy
      cradle-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:29099/prod-api/docs', timeout=5).read()"
        ]
      interval: 15s
      timeout: 10s
      retries: 20
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - cradle-network
    logging: *default-logging

  cradle-db:
    image: pgvector/pgvector:pg17
    container_name: cradle-db
    restart: unless-stopped
    shm_size: 72gb
    command: ["postgres", "-p", "54322", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: replace-with-a-strong-password
      POSTGRES_DB: cradle-fastapi
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --lc-collate=C --lc-ctype=C --data-checksums
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:54322:54322"
    volumes:
      - ./data/cradle-db:/var/lib/postgresql/data
      - ./deploy/postgres/postgresql.prod.conf:/etc/postgresql/postgresql.conf:ro
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/1-cradle-fastapi-pg.sql:ro
      - ./ruoyi-fastapi-backend/sql/rag_tables.sql:/docker-entrypoint-initdb.d/2-rag_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 54322 -d cradle-fastapi"]
      interval: 10s
      timeout: 10s
      retries: 30
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    networks:
      - cradle-network
    logging: *default-logging

  cradle-redis:
    image: redis:7.4-alpine
    container_name: cradle-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--tcp-keepalive",
        "60"
      ]
    ports:
      - "127.0.0.1:26379:6379"
    volumes:
      - ./data/cradle-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - cradle-network
    logging: *default-logging

  cradle-minio:
    profiles:
      - local-minio
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: cradle-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: replace-with-minio-access-key
      MINIO_ROOT_PASSWORD: replace-with-minio-secret-key
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - ./data/cradle-minio:/data
    networks:
      - cradle-network
    logging: *default-logging

networks:
  cradle-network:
    name: cradle-network
    driver: bridge
